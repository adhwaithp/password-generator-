<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>passord generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        <div class="inputbox">
            <input type="text" class="passbox" id ="passbox" disabled>
            <span class="material-symbols-outlined" id="copyicon">
                content_copy
                </span>
        </div>
        <input type="range" min="1" max="30" value="8" id="inputslider">
        <div class="row">
            <p>password length</p>
            <span id="slidervalue">4</span>
        </div>
        <div class="row">
            <label for="lowercase">include lowercase letters(a-z)</label>
            <input type="checkbox"name="lowercase" id="lowercase">
        </div>
        <div class="row">
            <label for="uppercase">include uppercase letters(a-z)</label>
            <input type="checkbox"name="uppercase" id="uppercase">
        </div>
        <div class="row">
            <label for="Numbers">include Numbers(0-9)</label>
            <input type="checkbox"name="Numbers" id="Numbers">
        </div>
        <div class="row">
            <label for="Symbols">include Symbols(@-*)</label>
            <input type="checkbox"name="Symbols" id="Symbols">
        </div>
        <button type="button"class="genBtn" id="genBtn">Generate Password</button>
    </div>
</body>
<script src="script.js"></script>
</html>
